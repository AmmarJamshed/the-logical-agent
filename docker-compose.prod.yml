# Production overrides
services:
  api:
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    restart: always

  worker:
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=8
    restart: always

  beat:
    restart: always

  web:
    command: npm run start
    restart: always
    environment:
      NODE_ENV: production
