apiVersion: apps/v1
kind: Deployment
metadata:
  name: tla-api
  labels:
    app: tla-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tla-api
  template:
    metadata:
      labels:
        app: tla-api
    spec:
      containers:
        - name: api
          image: ghcr.io/thelogicalagent/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: tla-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tla-api
spec:
  selector:
    app: tla-api
  ports:
    - port: 80
      targetPort: 8000
