name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        env:
          SECRET_KEY: ci-secret-key-the-logical-agent-must-be-long-enough-32
          DATABASE_URL: postgresql+asyncpg://tla:tla@localhost:5432/tla
          DATABASE_URL_SYNC: postgresql://tla:tla@localhost:5432/tla
          APP_ENV: test
          OLLAMA_ENABLED: "false"
        run: pytest -q tests/unit

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""
          NEXT_PUBLIC_APP_URL: https://web-navy-omega-62.vercel.app
