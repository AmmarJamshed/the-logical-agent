name: Intelligence Ingest

on:
  schedule:
    # Every 2 days at 06:00 UTC
    - cron: "0 6 */2 * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/ingest-intelligence.mjs"
      - "scripts/ingest-courses.mjs"
      - "scripts/ingest-research.mjs"
      - "scripts/ingest-startups.mjs"
      - ".github/workflows/intelligence-ingest.yml"

permissions:
  contents: write

concurrency:
  group: intelligence-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch news, courses, research, startups
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run intelligence ingest
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: llama-3.1-8b-instant,llama-3.3-70b-versatile
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ingest-intelligence.mjs

      - name: Run courses ingest
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node scripts/ingest-courses.mjs

      - name: Run research ingest
        run: node scripts/ingest-research.mjs

      - name: Run startups ingest
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node scripts/ingest-startups.mjs

      - name: Upload feed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-feeds
          path: |
            apps/web/public/data/intelligence-feed.json
            apps/web/public/data/courses-feed.json
            apps/web/public/data/research-feed.json
            apps/web/public/data/startups-feed.json
          retention-days: 14

      - name: Commit and push feeds
        run: |
          git config user.name "logical-agent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data/intelligence-feed.json apps/web/public/data/courses-feed.json apps/web/public/data/research-feed.json apps/web/public/data/startups-feed.json
          if git diff --staged --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git commit -m "chore(data): refresh intelligence, courses, research, startups feeds"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
