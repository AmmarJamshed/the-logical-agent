name: Intelligence Ingest (every 2 days)

on:
  schedule:
    # Every 2 days at 06:00 UTC
    - cron: "0 6 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ingest NewsAPI + social sources
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: llama-3.1-8b-instant,llama-3.3-70b-versatile
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ingest-intelligence.mjs

      - name: Commit feed if changed
        run: |
          git config user.name "logical-agent-bot"
          git config user.email "bot@thelogicalagent.local"
          git add apps/web/public/data/intelligence-feed.json
          if git diff --staged --quiet; then
            echo "No feed changes"
          else
            git commit -m "chore(data): refresh intelligence feed (NewsAPI + social)"
            git push
          fi
